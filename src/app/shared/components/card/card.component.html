<div class="card" [routerLink]="['/adverts', advert.id]">
    <div class="card-img">
        <img [src]="imageUrl | imagePipe" alt="{{advert.name}}">
    </div>
    <div class="card-name">{{advert.name}}</div>
    <div class="card-cost">{{advert.cost}} ₽</div>
    <div class="card-location">{{advert.location}}</div>
    <div class="card-created-at">{{advert.createdAt | transformDatePipe}}</div>

</div>
