<div class="container">
    <div class="card-grid">
        @for (advert of adverts(); track advert.id) {
         <app-card 
         [advert] = "advert"
         [imageUrl]="imageUrls()[advert.id]">
        </app-card>
        }

        @if (adverts().length === 0) {
            <div class="empty">
                <p>Объявления не найдены</p>
            </div>
        }
    </div>
</div>
