<div class="advert-deitails">
    <div class="container">
        <div class="advert-details-block">
            <div class="advert-details-block-left">
                    <div class="advert-details-block-left-label">
                        <h2> {{advert?.name}}</h2>
                    </div>

                <div class="advert-details-gallery">
                    <p-galleria
                        [value]="images"
                        [numVisible]="3"
                        [circular]="true"
                        [showItemNavigators]="true"
                        [showThumbnails]="images.length > 1">
                        <ng-template pTemplate="item" let-item>
                            <img [src]="item | imagePipe"
                            [alt]="advert?.name"
                            class="image"
                            style="width: 856px; height: 512px; object-fit: cover;" />
                        </ng-template>
                        <ng-template pTemplate="thumbnail" let-item>
                            <img
                            [src]="item | imagePipe"
                            [alt]="advert?.name" 
                            class="thumbnail-image"
                            style="width: 120px; height: 84px; object-fit: cover;" />
                        </ng-template>
                    </p-galleria>
                </div>
            </div>
            <div class="advert-details-block-right">
                <div class="advert-details-block-right-section">
                    <h2 class="price"> {{advert?.cost}} руб.</h2>
                    <div *ngIf="showPhone; else phoneButton">
                        <p class="phone">{{advert?.phone}}</p>
                    </div>
                    <ng-template #phoneButton>
                        <button
                        pButton
                        size="large"
                        styleClass="p-button-primary p-button-lg"
                        *ngIf="isAuthenticated"
                        label="Показать телефон"
                        (click)="togglePhone()">
                        </button>
                        <p *ngIf="!isAuthenticated">Чтобы увидеть телефон, необходимо авторизироваться</p>
                    </ng-template>
                </div>
                

                <div class="advert-details-block-right-section">
                    <h3>Адрес</h3>
                    <p>{{advert?.location}}</p>
                </div>

                <div class="advert-details-block-right-section">
                        <h3>Описание</h3>
                        <p>{{advert?.description || 'описание отсутствует'}}</p>   
                </div>
                
                <div class="advert-details-block-right-section">
                    <h3>Объявление создано</h3>
                    <p>{{advert?.created | transformDatePipe }}</p>
                 </div>
                <div *ngIf="!advert" class="loading">Загрузка...</div>  

            </div>

        </div>

    </div>
</div>
